<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>荔枝溯源查询系统</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Microsoft YaHei', '微软雅黑', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: #333;
            line-height: 1.6;
            min-height: 100vh;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
            padding: 20px;
        }

        .header {
            background: rgba(255,255,255,0.95);
            backdrop-filter: blur(10px);
            border-radius: 15px;
            padding: 30px;
            margin-bottom: 30px;
            text-align: center;
            box-shadow: 0 8px 32px rgba(0,0,0,0.1);
        }

        .logo {
            font-size: 48px;
            margin-bottom: 15px;
        }

        .title {
            font-size: 28px;
            color: #667eea;
            margin-bottom: 10px;
        }

        .subtitle {
            color: #666;
            font-size: 16px;
        }

        .search-section {
            background: white;
            border-radius: 15px;
            padding: 40px;
            margin-bottom: 30px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.1);
            text-align: center;
        }

        .search-title {
            font-size: 24px;
            color: #667eea;
            margin-bottom: 20px;
        }

        .search-input {
            width: 100%;
            max-width: 400px;
            padding: 15px 20px;
            border: 2px solid #e1e5e9;
            border-radius: 25px;
            font-size: 16px;
            margin-bottom: 20px;
            outline: none;
            transition: border-color 0.3s;
        }

        .search-input:focus {
            border-color: #667eea;
        }

        .search-btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 15px 30px;
            border-radius: 25px;
            font-size: 16px;
            cursor: pointer;
            transition: transform 0.2s;
        }

        .search-btn:hover {
            transform: translateY(-2px);
        }

        .result-section {
            background: white;
            border-radius: 15px;
            padding: 40px;
            margin-bottom: 30px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.1);
            display: none;
        }

        .loading {
            text-align: center;
            padding: 60px;
            color: #666;
            display: none;
        }

        .error-section {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
            border-radius: 15px;
            padding: 40px;
            text-align: center;
            display: none;
        }

        .product-header {
            border-bottom: 3px solid #667eea;
            padding-bottom: 20px;
            margin-bottom: 30px;
            text-align: center;
        }

        .product-title {
            font-size: 32px;
            color: #667eea;
            margin-bottom: 10px;
        }

        .product-id {
            background: #f8f9fa;
            color: #666;
            padding: 10px 20px;
            border-radius: 20px;
            display: inline-block;
            font-family: monospace;
            font-size: 14px;
        }

        .info-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 40px;
        }

        .info-card {
            background: #f8f9fa;
            border-radius: 10px;
            padding: 20px;
            text-align: center;
            border-left: 4px solid #667eea;
        }

        .info-label {
            font-weight: bold;
            color: #667eea;
            margin-bottom: 8px;
            font-size: 14px;
        }

        .info-value {
            color: #333;
            font-size: 16px;
        }

        .trace-section {
            margin-bottom: 30px;
        }

        .section-header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 15px 20px;
            border-radius: 10px;
            margin-bottom: 20px;
            font-size: 18px;
        }

        .timeline {
            position: relative;
            padding-left: 40px;
        }

        .timeline::before {
            content: '';
            position: absolute;
            left: 20px;
            top: 0;
            bottom: 0;
            width: 3px;
            background: #667eea;
            border-radius: 2px;
        }

        .timeline-item {
            position: relative;
            margin-bottom: 20px;
            padding: 15px 20px;
            background: #f8f9fa;
            border-radius: 8px;
            border-left: 3px solid #667eea;
        }

        .timeline-item::before {
            content: '';
            position: absolute;
            left: -26px;
            top: 20px;
            width: 12px;
            height: 12px;
            background: #667eea;
            border-radius: 50%;
            border: 3px solid white;
        }

        .timeline-time {
            color: #667eea;
            font-weight: bold;
            font-size: 14px;
            margin-bottom: 5px;
        }

        .timeline-desc {
            color: #555;
            line-height: 1.5;
        }

        .blockchain-section {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border-radius: 15px;
            padding: 30px;
            text-align: center;
        }

        .blockchain-title {
            font-size: 24px;
            margin-bottom: 20px;
        }

        .hash-display {
            background: rgba(255,255,255,0.1);
            padding: 15px;
            border-radius: 8px;
            font-family: monospace;
            font-size: 12px;
            word-break: break-all;
            margin: 15px 0;
        }

        .verification-status {
            display: inline-block;
            padding: 10px 25px;
            background: #28a745;
            color: white;
            border-radius: 25px;
            font-weight: bold;
            margin: 15px 0;
        }

        .footer {
            text-align: center;
            padding: 30px;
            color: white;
            font-size: 14px;
        }

        .back-btn {
            display: inline-block;
            margin-top: 20px;
            padding: 12px 25px;
            background: #6c757d;
            color: white;
            text-decoration: none;
            border-radius: 6px;
            transition: background 0.3s;
        }

        .back-btn:hover {
            background: #5a6268;
        }

        @media (max-width: 768px) {
            .container {
                padding: 10px;
            }

            .info-grid {
                grid-template-columns: 1fr;
            }

            .header {
                padding: 20px;
            }

            .search-section {
                padding: 30px 20px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="logo">🌰</div>
            <h1 class="title">荔链直达 - 溯源查询系统</h1>
            <p class="subtitle">区块链技术保障食品安全，扫描二维码即可查询</p>
        </div>

        <div class="search-section">
            <h2 class="search-title">请输入溯源码查询</h2>
            <input type="text" id="traceCode" class="search-input" placeholder="请输入溯源码..." autofocus>
            <br>
            <button onclick="searchTrace()" class="search-btn">查询溯源信息</button>

            <div style="margin-top: 20px; font-size: 14px; color: #666;">
                <p><strong>示例溯源码：</strong></p>
                <p style="font-family: monospace; background: #f8f9fa; padding: 5px 10px; border-radius: 4px; display: inline-block; margin-top: 5px;">
                    LC20240117001, LC20240117002
                </p>
            </div>
        </div>

        <div id="loading" class="loading">
            <div style="font-size: 18px;">🔍 正在查询溯源信息...</div>
        </div>

        <div id="result" class="result-section">
            <!-- 结果将在这里显示 -->
        </div>

        <div id="error" class="error-section">
            <h3>❌ 查询失败</h3>
            <p id="error-message">未找到相关溯源信息</p>
        </div>
    </div>

    <div class="footer">
        <p>荔链直达 - 专业农产品溯源查询系统 | 技术支持：区块链数字溯源平台</p>
    </div>

    <script>
        // 产品溯源数据
        const traceData = {
            'LC20240117001': {
                name: '妃子笑荔枝',
                id: 'LC20240117001',
                location: '广东省茂名市电白区',
                farmer: '李师傅',
                harvestDate: '2024-06-15',
                planting: [
                    { time: '2024-01-15', desc: '开始种植，选用优质妃子笑荔枝种苗' },
                    { time: '2024-03-20', desc: '施用有机肥料，严格控制农药使用' },
                    { time: '2024-06-15', desc: '手工采摘，成熟度达95%以上' }
                ],
                processing: [
                    { time: '2024-06-15 14:00', desc: '进入冷链运输，温度控制在4-6°C' },
                    { time: '2024-06-15 18:00', desc: '到达加工厂，开始分级筛选' },
                    { time: '2024-06-15 20:00', desc: '真空预冷处理，锁住新鲜度' }
                ],
                logistics: [
                    { time: '2024-06-16 08:00', desc: '发往广州批发市场，全程冷链运输' },
                    { time: '2024-06-16 12:00', desc: '到达广州，温度监测正常' },
                    { time: '2024-06-17', desc: '进入零售渠道' }
                ],
                blockchain: {
                    hash: 'a1b2c3d4e5f678901234567890abcdef1234567890abcdef1234567890abcdef',
                    status: '已验证',
                    timestamp: '2024-06-15 10:30:25'
                }
            },
            'LC20240117002': {
                name: '桂味荔枝',
                id: 'LC20240117002',
                location: '广东省湛江市徐闻县',
                farmer: '王阿姨',
                harvestDate: '2024-06-20',
                planting: [
                    { time: '2024-01-20', desc: '开始种植，选用当地优质桂味荔枝品种' },
                    { time: '2024-04-10', desc: '采用生态种植，无公害生产' },
                    { time: '2024-06-20', desc: '适时采摘，保证最佳口感' }
                ],
                processing: [
                    { time: '2024-06-20 15:30', desc: '快速预冷，保持果实新鲜' },
                    { time: '2024-06-20 19:00', desc: '专业分级，优果优价' },
                    { time: '2024-06-20 21:00', desc: '包装入库，准备发货' }
                ],
                logistics: [
                    { time: '2024-06-21 07:00', desc: '冷链运输发往深圳市场' },
                    { time: '2024-06-21 11:30', desc: '到达深圳物流中心' },
                    { time: '2024-06-22', desc: '配送至各大超市' }
                ],
                blockchain: {
                    hash: 'f9e8d7c6b5a493827261514030201f9e8d7c6b5a493827261514030201f9e8d7c6',
                    status: '已验证',
                    timestamp: '2024-06-20 09:15:40'
                }
            }
        };

        // 渲染溯源结果
        function renderResult(product) {
            return `
                <div class="product-header">
                    <h2 class="product-title">${product.name}</h2>
                    <div class="product-id">溯源码: ${product.id}</div>
                </div>

                <div class="info-grid">
                    <div class="info-card">
                        <div class="info-label">🌍 产地信息</div>
                        <div class="info-value">${product.location}</div>
                    </div>
                    <div class="info-card">
                        <div class="info-label">👨‍🌾 农户信息</div>
                        <div class="info-value">${product.farmer}</div>
                    </div>
                    <div class="info-card">
                        <div class="info-label">📅 采摘日期</div>
                        <div class="info-value">${product.harvestDate}</div>
                    </div>
                    <div class="info-card">
                        <div class="info-label">⏰ 查询时间</div>
                        <div class="info-value">${new Date().toLocaleString()}</div>
                    </div>
                </div>

                <div class="trace-section">
                    <div class="section-header">🌱 种植过程</div>
                    <div class="timeline">
                        ${product.planting.map(item => `
                            <div class="timeline-item">
                                <div class="timeline-time">${item.time}</div>
                                <div class="timeline-desc">${item.desc}</div>
                            </div>
                        `).join('')}
                    </div>
                </div>

                <div class="trace-section">
                    <div class="section-header">🏭 加工过程</div>
                    <div class="timeline">
                        ${product.processing.map(item => `
                            <div class="timeline-item">
                                <div class="timeline-time">${item.time}</div>
                                <div class="timeline-desc">${item.desc}</div>
                            </div>
                        `).join('')}
                    </div>
                </div>

                <div class="trace-section">
                    <div class="section-header">🚚 物流过程</div>
                    <div class="timeline">
                        ${product.logistics.map(item => `
                            <div class="timeline-item">
                                <div class="timeline-time">${item.time}</div>
                                <div class="timeline-desc">${item.desc}</div>
                            </div>
                        `).join('')}
                    </div>
                </div>

                <div class="blockchain-section">
                    <h2 class="blockchain-title">🔒 区块链验证</h2>
                    <div class="verification-status">${product.blockchain.status}</div>
                    <div class="hash-display">
                        区块链哈希值: ${product.blockchain.hash}
                    </div>
                    <div>验证时间戳: ${product.blockchain.timestamp}</div>
                </div>
            `;
        }

        // 搜索溯源信息
        function searchTrace() {
            const traceCode = document.getElementById('traceCode').value.trim().toUpperCase();

            // 隐藏所有区域
            document.getElementById('result').style.display = 'none';
            document.getElementById('error').style.display = 'none';
            document.getElementById('loading').style.display = 'block';

            // 模拟加载延迟
            setTimeout(() => {
                document.getElementById('loading').style.display = 'none';

                const product = traceData[traceCode];

                if (product) {
                    document.getElementById('result').innerHTML = renderResult(product);
                    document.getElementById('result').style.display = 'block';
                    document.title = `${product.name} - 荔枝溯源查询`;
                } else {
                    document.getElementById('error-message').textContent = `未找到溯源码 "${traceCode}" 的相关信息，请检查溯源码是否正确。`;
                    document.getElementById('error').style.display = 'block';
                }
            }, 800);
        }

        // 从URL参数自动查询
        window.onload = function() {
            const urlParams = new URLSearchParams(window.location.search);
            const productId = urlParams.get('id');

            if (productId) {
                document.getElementById('traceCode').value = productId;
                searchTrace();
            }
        };

        // 回车键搜索
        document.getElementById('traceCode').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                searchTrace();
            }
        });
    </script>
</body>
</html>
